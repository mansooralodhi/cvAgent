projects:
- id: bacterial_growth_simulator
  title: Bacterial Growth Simulator
  start: "2025-10"
  end: "2025-12"
  url: "https://github.com/mansooralodhi/cvPolyTracker"
  bullets:

  - "Built interactive desktop application using Tkinter to simulate bacterial population dynamics."
  - "Implemented mathematical model combining logistic growth with temperature, pH, and nutrient constraints."
  - "Developed real-time visualization for growth curves under varying environmental conditions."
  - "Created parameter optimization tools for predicting bacterial doubling times."

- id: interval_adjoint_nn_pruning
  title: Interval-Adjoint Sensitivity Guided Neural Network Pruning
  designation: MS Thesis
  start: "2025-01"
  end: "2025-07"
  url: "https://github.com/mansooralodhi/nnpruning"
  bullets:

  - "Developed a structured layerwise iterative pruning algorithm."
  - "Trained and fine-tuned the neural networks using the PyTorch library."
  - "Defined an extended interval arithmetic datatype in Python with overloaded arithmetic operators."
  - "Defined a custom neural network representation, NNModuleLike, with forward and reverse pass methods."
  - "Employed NNModuleLike neural network representation to compute interval-adjoints."
  - "Applied interval-adjoint based significance measures to prune neurons."

- id: real_time_fire_monitoring
  title: Real-Time Fire Monitoring System
  start: "2023-02"
  end: "2023-04"
  url: "https://github.com/mansooralodhi/fireMonitoring"
  bullets:

  - "Integrated PM2.5 dust sensor with Arduino to detect smoke."
  - "Utilized the Raspberry Pi Camera Module for smoke image acquisition."
  - "Established Serial communication between Arduino and Raspberry Pi."
  - "Developed a Flask-based web server on a Raspberry Pi to live-stream fire images."
  - "Generated email alerts using SMTP (smtplib) in case of fire detection."
  - "Utilized Multithreading to simultaneously acquire peripheral data and manage live streaming."

- id: protein_protein_interaction_prediction
  title: Protein–Protein Interaction Prediction Using Deep Learning
  start: "2023-02"
  end: "2023-04"
  bullets:

  - "Developed a deep learning model to predict protein–protein interactions using sequence-based data."
  - "Collected interacting and non-interacting protein pairs from the UniProt database."
  - "Implemented a Siamese-like convolutional neural network with four convolutional layers and one dense layer."
  - "Trained the model on 20,000 two-dimensional protein sequence representations."
  - "Performed binary classification to distinguish interacting from non-interacting protein pairs."

- id: real_time_polygon_tracker
  title: Real-Time Polygon Tracker
  start: "2022-09"
  end: "2022-12"
  url: "https://github.com/mansooralodhi/cvPolyTracker"
  bullets:

  - "Developed tool for continuous detection and recognition of 2D polygons."
  - "Detected and identified object shapes and relative sizes using the OpenCV library."
  - "Applied Watershed algorithm to resolve object collisions and enhance object detection."
  - "Implemented object recognition based on a predefined maximum Euclidean distance."

- id: restaurant_location_recommender
  title: Restaurant Location Recommender System
  start: "2022-09"
  end: "2022-12"
  bullets:

  - "Leveraged the Foursquare API to obtain restaurant data using longitude and latitude information."
  - "Performed data extraction and preprocessing using the Pandas library."
  - "Identified top restaurant hotspots using K-means clustering."
  - "Developed functionality for users to visualize and analyze clusters using Folium library."
  - "Recommended optimal restaurant locations using regional restaurant density analysis."

- id: supraspinatus_muscle_segmentation
  title: Supraspinatus Muscle Segmentation from 2D MRI Images
  designation: BS Thesis
  start: "2019-01"
  end: "2019-06"
  bullets:

  - "Developed a robust tool in Python for automatic muscle segmentation in 2D MRI images."
  - "Applied log transformation to enhance image contrast in medical images."
  - "Applied a weighted loss function to mitigate class imbalance in training data."
  - "Implemented and trained SegNet with Intersection-over-Union (IoU) as the evaluation metric."
